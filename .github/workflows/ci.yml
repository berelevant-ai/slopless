name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - run: node --test scripts/cli-config.test.mjs
      - run: node --test scripts/runtime.test.mjs
      - run: node --test scripts/paragraph-batching.test.mjs
      - run: node runners/datasets.mjs
      - run: node scripts/datasets-contract.mjs behavior/fixtures/datasets/contract.json
      - run: node --test runners/jev-paragraphs.test.mjs
