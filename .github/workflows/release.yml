name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package.json version '$pkg'"
            exit 1
          fi
      - run: pnpm publish --provenance --access public --no-git-checks
      - name: Notify Be Relevant
        env:
          GH_TOKEN: ${{ secrets.BERELEVANT_RELEASE_DISPATCH_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq -n --arg version "$version" \
            '{event_type:"slopless-released",client_payload:{version:$version}}' |
            gh api --method POST \
              repos/berelevant-ai/berelevant/dispatches \
              --input -
